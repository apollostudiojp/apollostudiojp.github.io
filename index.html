<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@300;400;500&display=swap" rel="stylesheet">
<title>apollo studio</title>
<link rel="stylesheet" href="/style.css?v=8">
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">apollo studio</div>
    <nav class="nav-links" id="navLinks">
      <a href="/" class="active">Home</a>
      <a href="/price/">Price</a>
      <a href="/gallery/">Gallery</a>
      <a href="/studio/">Studio</a>
      <a href="/reservation/">ご予約</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="home-hero">
  <div class="hero-slider" id="heroSlider">
    <div class="hero-slide active"><img src="/images/home/hero-1.jpg" alt="" loading="eager"></div>
    <div class="hero-slide"><img src="/images/home/hero-2.jpg" alt="" loading="lazy"></div>
    <div class="hero-slide"><img src="/images/home/hero-3.jpg" alt="" loading="lazy"></div>
    <div class="hero-slide"><img src="/images/home/hero-4.jpg" alt="" loading="lazy"></div>
    <div class="hero-slide"><img src="/images/home/hero-5.jpg" alt="" loading="lazy"></div>
    <div class="hero-slide"><img src="/images/home/hero-6.jpg" alt="" loading="lazy"></div>
  </div>
</section>

<section class="home-intro">
  <div class="intro-text" style="grid-column: 1 / -1; max-width: 720px; margin: 0 auto; text-align: center;">
    <h2 class="intro-heading">なにげない時間の中にある、<br class="pc-br">やさしい瞬間を。</h2>
    <div class="intro-body">
      <p>七五三や誕生日、家族写真など、人生の節目にそっと寄り添う撮影を大切にしています。<br class="pc-br">スタジオならではの落ち着いた空間で、自然な表情を引き出します。</p>
    </div>
  </div>
</section>

<section class="cross-link-banner">
  <div class="cross-link-box">
    <p class="cross-link-label">わんこの撮影をご希望の方はこちら</p>
    <a href="https://apollodoggie.github.io/" target="_blank" rel="noopener noreferrer" class="cross-link-button">apollo doggie studio</a>
  </div>
</section>

<footer>
  &copy; 2026 apollo studio
</footer>

<script src="/slider.js?v=1"></script>
<script src="/nav.js?v=1"></script>
</body>
</html>
